<!DOCTYPE html>
<html class="theme-light">
<head>
<style>
  html.theme-light {
    filter: invert(1) hue-rotate(180deg);
  }
  body {
    height: 2000px;
    background: #000;
    color: #fff;
  }
  .fixed-box {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 100px;
    height: 100px;
    background: red;
  }
</style>
</head>
<body>
  <div class="fixed-box">Fixed</div>
</body>
</html>
